<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking Meeting Room SVO</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e1e5ea;--ac:#2f6fed;--acs:#e8f0ff;--dg:#d33a3a;--c0:#2f6fed;--c1:#12a37f;--c2:#e08a00;--c3:#a14ee0}
@media (prefers-color-scheme:dark){:root{--bg:#14181e;--card:#1d232c;--tx:#e8ecf1;--mu:#93a0b2;--bd:#2c3542;--ac:#5b92ff;--acs:#22304a;--dg:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:22px;margin:0}.sub{color:var(--mu);margin:2px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.full{grid-column:1/-1}
button{font:inherit;cursor:pointer;border-radius:10px;border:0;padding:11px 16px}
button:disabled{opacity:.6;cursor:wait}
.pri{background:var(--ac);color:#fff;font-weight:600;width:100%}
.ghost{background:transparent;color:var(--dg);padding:4px 8px;border:1px solid var(--bd);font-size:13px}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.rooms{grid-template-columns:1fr 1fr}}
.room{border:2px solid var(--bd);background:var(--bg);color:var(--tx);text-align:left;padding:10px}
.room b{display:block}.room small{color:var(--mu)}
.room.on{border-color:var(--ac);background:var(--acs)}
.msg{margin-top:10px;font-size:14px;min-height:20px}.err{color:var(--dg)}.ok{color:#12a37f}
.warn{background:#fff3cd;color:#664d03;border-radius:10px;padding:10px 12px;margin-bottom:14px;display:none}
.tl{overflow-x:auto}.tlin{min-width:640px}
.row{display:flex;align-items:center;margin-bottom:8px}
.rn{width:92px;font-size:13px;font-weight:600;flex:none}
.bar{position:relative;flex:1;height:38px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;background-image:linear-gradient(to right,var(--bd) 1px,transparent 1px);background-size:10% 100%}
.blk{position:absolute;top:3px;bottom:3px;border-radius:6px;color:#fff;font-size:11px;padding:2px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hrs{display:flex;margin-left:92px;font-size:11px;color:var(--mu)}.hrs span{flex:1}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.it{flex:1;min-width:0}.it b{display:block}.it span{color:var(--mu);font-size:13px}
.empty{color:var(--mu);text-align:center;padding:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Booking Meeting Room SVO</h1>
  <p class="sub">Pilih ruangan, isi detail meeting, langsung cek jadwal yang bentrok.</p>
  <div class="warn" id="warn">API_URL belum diisi di index.html. Ikuti README dulu supaya booking bisa tersimpan.</div>

  <div class="card">
    <h2>Booking baru</h2>
    <label>Ruangan</label>
    <div class="rooms" id="rooms"></div>
    <div class="grid" style="margin-top:12px">
      <div class="full"><label for="mt">Meeting apa</label><input id="mt" placeholder="Contoh: Interview kandidat sales"></div>
      <div class="full"><label for="who">Atasan / Dealer</label><input id="who" placeholder="Nama atasan atau dealer"></div>
      <div><label for="dt">Tanggal</label><input type="date" id="dt"></div>
      <div><label for="by">Dipesan oleh</label><input id="by" placeholder="Nama kamu"></div>
      <div><label for="st">Jam mulai</label><select id="st"></select></div>
      <div><label for="du">Durasi</label><select id="du">
        <option value="30">30 menit</option><option value="60" selected>1 jam</option><option value="90">1,5 jam</option>
        <option value="120">2 jam</option><option value="180">3 jam</option><option value="240">4 jam</option></select></div>
      <div class="full"><button class="pri" id="go">Booking sekarang</button><div class="msg" id="msg"></div></div>
    </div>
  </div>

  <div class="card">
    <h2>Jadwal <span id="dlabel"></span></h2>
    <div class="tl"><div class="tlin"><div class="hrs" id="hrs"></div><div id="tl"></div></div></div>
  </div>

  <div class="card"><h2>Daftar booking</h2><div id="list"></div></div>
</div>

<script>
// === ISI DENGAN URL WEB APP DARI APPS SCRIPT (lihat README) ===
var API_URL = "https://script.google.com/macros/s/AKfycby5-wl6WRHGMuxbAe6Pky0v8u0UwaM2WyPfmvZkLKLptme0XiVc4K3KG6H3UiptXWRanw/exec";

var ROOMS=[{n:"Ruang A",d:"Kecil · 4 orang"},{n:"Ruang B",d:"Sedang · 8 orang"},{n:"Ruang C",d:"Besar · 12 orang"},{n:"Ruang D",d:"Interview / privat"}];
var COL=["var(--c0)","var(--c1)","var(--c2)","var(--c3)"];
var H0=8,H1=18,sel=0,bookings=[];
var $=function(i){return document.getElementById(i)};
function pad(n){return (n<10?"0":"")+n}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function tm(m){return pad(Math.floor(m/60))+"."+pad(m%60)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function setMsg(t,c){var m=$("msg");m.textContent=t;m.className="msg "+(c||"")}

(function(){
  var s=$("st");
  for(var m=H0*60;m<H1*60;m+=30){var o=document.createElement("option");o.value=m;o.textContent=tm(m);s.appendChild(o)}
  $("dt").value=today();
  var h=$("hrs");
  for(var i=H0;i<H1;i++){var sp=document.createElement("span");sp.textContent=pad(i);h.appendChild(sp)}
  $("dt").onchange=render;$("go").onclick=save;drawRooms();
  if(!API_URL)$("warn").style.display="block";
})();

function drawRooms(){
  var w=$("rooms");w.innerHTML="";
  ROOMS.forEach(function(r,i){
    var b=document.createElement("button");b.className="room"+(i===sel?" on":"");
    b.innerHTML="<b>"+r.n+"</b><small>"+r.d+"</small>";
    b.onclick=function(){sel=i;drawRooms()};w.appendChild(b);
  });
}
function dayList(){var d=$("dt").value;return bookings.filter(function(b){return b.date===d}).sort(function(a,b){return a.start-b.start})}

function render(){
  var d=$("dt").value,L=dayList();
  $("dlabel").textContent=d?"· "+new Date(d+"T00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):"";
  var tl=$("tl");tl.innerHTML="";
  ROOMS.forEach(function(r,i){
    var row=document.createElement("div");row.className="row";
    var html='<div class="rn">'+r.n+'</div><div class="bar">';
    L.filter(function(b){return b.room===i}).forEach(function(b){
      var l=(b.start-H0*60)/((H1-H0)*60)*100,w=b.dur/((H1-H0)*60)*100;
      html+='<div class="blk" style="left:'+l+'%;width:'+w+'%;background:'+COL[i]+'" title="'+esc(b.title)+'">'+esc(b.title)+'</div>';
    });
    row.innerHTML=html+"</div>";tl.appendChild(row);
  });
  var ls=$("list");
  if(!L.length){ls.innerHTML='<div class="empty">Belum ada booking di tanggal ini.</div>';return}
  ls.innerHTML="";
  L.forEach(function(b){
    var el=document.createElement("div");el.className="item";
    el.innerHTML='<div class="dot" style="background:'+COL[b.room]+'"></div><div class="it"><b>'+esc(b.title)+'</b><span>'+
      ROOMS[b.room].n+' · '+tm(b.start)+'–'+tm(b.start+b.dur)+' ('+(b.dur/60)+' jam)<br>Atasan/Dealer: '+esc(b.who)+(b.by?' · oleh '+esc(b.by):'')+'</span></div>';
    var x=document.createElement("button");x.className="ghost";x.textContent="Batalkan";
    x.onclick=function(){if(confirm("Batalkan booking ini?"))remove(b.id)};
    el.appendChild(x);ls.appendChild(el);
  });
}

function call(payload){
  return fetch(API_URL,{method:"POST",body:JSON.stringify(payload)}).then(function(r){return r.json()});
}
function load(){
  if(!API_URL)return;
  fetch(API_URL).then(function(r){return r.json()}).then(function(j){bookings=j.bookings||[];render()}).catch(function(){});
}

function save(){
  if(!API_URL){setMsg("API_URL belum diisi, lihat README.","err");return}
  var t=$("mt").value.trim(),w=$("who").value.trim(),d=$("dt").value,st=+$("st").value,du=+$("du").value;
  if(!t||!w||!d){setMsg("Isi dulu meeting apa, atasan/dealer, dan tanggal.","err");return}
  if(st+du>H1*60){setMsg("Melewati jam "+H1+".00, kurangi durasi atau mulai lebih awal.","err");return}
  var clash=bookings.filter(function(b){return b.date===d&&b.room===sel&&st<b.start+b.dur&&b.start<st+du})[0];
  if(clash){setMsg("Bentrok dengan “"+clash.title+"” ("+tm(clash.start)+"–"+tm(clash.start+clash.dur)+"). Pilih jam atau ruangan lain.","err");return}
  var btn=$("go");btn.disabled=true;setMsg("Menyimpan…");
  call({action:"add",room:sel,title:t,who:w,by:$("by").value.trim(),date:d,start:st,dur:du}).then(function(j){
    if(j.ok){setMsg("Booking berhasil ✓","ok");$("mt").value="";$("who").value="";load()}
    else if(j.error==="clash"){setMsg("Baru saja dibooking orang lain: “"+j.title+"”. Pilih jam lain.","err");load()}
    else setMsg("Gagal menyimpan.","err");
  }).catch(function(){setMsg("Gagal terhubung ke server. Cek API_URL dan akses Web app.","err")})
  .then(function(){btn.disabled=false});
}
function remove(id){
  call({action:"delete",id:id}).then(load).catch(function(){setMsg("Gagal membatalkan.","err")});
}

load();
setInterval(load,20000);
</script>
</body>
</html>
